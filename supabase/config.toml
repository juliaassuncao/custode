# Local development only; no hosted project reference or credentials.
project_id = "custode-community"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
enable_anonymous_sign_ins = true

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

# Only this read-only endpoint is public. CORS is not authorization.
[functions.community-read]
verify_jwt = false

[functions.community-write]
verify_jwt = true
